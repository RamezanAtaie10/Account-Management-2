<script>
/* ---------------- storage ---------------- */
const DB_KEY = 'account-manager-db-v1';
function loadDB() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    return raw ? JSON.parse(raw) : { accounts: {} };
  } catch (e) { return { accounts: {} }; }
}
function saveDB(db) {
  try { localStorage.setItem(DB_KEY, JSON.stringify(db)); return true; }
  catch (e) { return false; }
}
let DB = loadDB();
let session = null; // username
const REMEMBER_KEY = 'account-manager-remembered-user';
function getRememberedUsername(){ try { return localStorage.getItem(REMEMBER_KEY); } catch(e){ return null; } }
function setRememberedUsername(u){ try { localStorage.setItem(REMEMBER_KEY, u); } catch(e){} }
function clearRememberedUsername(){ try { localStorage.removeItem(REMEMBER_KEY); } catch(e){} }

/* ---------------- helpers ---------------- */
const CURRENCIES = [ {code:'AFN', label:'افغانی'}, {code:'TMN', label:'تومان'}, {code:'USD', label:'دالر'}, {code:'EUR', label:'یورو'}, {code:'TRY', label:'لیر'}, {code:'PKR', label:'کلدار'} ];
const STAT_ORDER = ['AFN','TMN','USD','EUR','TRY','PKR'];
function curLabel(code){ const c = CURRENCIES.find(x=>x.code===code); return c ? c.label : code; }
function fmt(n){ return (Number(n)||0).toLocaleString('fa-IR'); }
function fmtMoney(n, code){ return fmt(n) + ' ' + curLabel(code); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function showToast(message){
  let container = document.getElementById('toast-container');
  if(!container){
    container = document.createElement('div');
    container.id = 'toast-container';
    document.body.appendChild(container);
  }
  const toast = document.createElement('div');
  toast.className = 'toast-msg';
  toast.innerHTML = '<div class="toast-check">✓</div><div class="toast-text"></div>';
  toast.querySelector('.toast-text').textContent = message;
  container.appendChild(toast);
  setTimeout(()=>{ toast.classList.add('toast-hide'); }, 1600);
  setTimeout(()=>{ toast.remove(); }, 2100);
}
function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str==null?'':String(str); return d.innerHTML; }
function simpleHash(str){ let h=0; for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))>>>0; return h.toString(36); }
function nowLocalInput(){
  const d = new Date(); const p = x => String(x).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function toJalaliNumeric(d){
  try {
    const parts = new Intl.DateTimeFormat('en-US-u-ca-persian',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(d);
    const map = {};
    parts.forEach(p => { map[p.type] = p.value; });
    return `${map.year}/${map.month}/${map.day}`;
  } catch(e){ return ''; }
}
function getJalaliParts(d){
  try {
    const parts = new Intl.DateTimeFormat('en-US-u-ca-persian',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(d);
    const map = {};
    parts.forEach(p => { map[p.type] = p.value; });
    return { jy: parseInt(map.year,10), jm: parseInt(map.month,10), jd: parseInt(map.day,10) };
  } catch(e){ return { jy:1404, jm:1, jd:1 }; }
}
function jalaliToGregorian(jy, jm, jd){
  jy = parseInt(jy,10); jm = parseInt(jm,10); jd = parseInt(jd,10);
  let gy;
  if (jy > 979) { gy = 1600; jy -= 979; } else { gy = 621; }
  let days = (365*jy) + (Math.floor(jy/33)*8) + Math.floor(((jy%33)+3)/4) + 78 + jd + ((jm<7) ? (jm-1)*31 : ((jm-7)*30)+186);
  gy += 400*Math.floor(days/146097);
  days %= 146097;
  if (days > 36524) {
    gy += 100*Math.floor(--days/36524);
    days %= 36524;
    if (days >= 365) days++;
  }
  gy += 4*Math.floor(days/1461);
  days %= 1461;
  if (days > 365) {
    gy += Math.floor((days-1)/365);
    days = (days-1)%365;
  }
  let gd = days + 1;
  const isLeap = (gy%4===0 && gy%100!==0) || (gy%400===0);
  const salA = [0,31, isLeap?29:28, 31,30,31,30,31,31,30,31,30,31];
  let gm;
  for (gm = 1; gm <= 12; gm++) {
    const v = salA[gm];
    if (gd <= v) break;
    gd -= v;
  }
  return { gy, gm, gd };
}
function jalaliDateTimeToISO(jy, jm, jd, hh, mm){
  const { gy, gm, gd } = jalaliToGregorian(jy, jm, jd);
  const d = new Date(gy, gm-1, gd, parseInt(hh,10)||0, parseInt(mm,10)||0, 0, 0);
  return d.toISOString();
}
function fmtDateTime(iso){
  if(!iso) return '';
  try {
    const d = new Date(iso);
    const datePart = toJalaliNumeric(d);
    const p = x => String(x).padStart(2,'0');
    return `${datePart} - ${p(d.getHours())}:${p(d.getMinutes())}`;
  } catch(e){ return iso; }
}
/* Persian number to words */
const YEKAN=["","یک","دو","سه","چهار","پنج","شش","هفت","هشت","نه"];
const DAHYEK=["ده","یازده","دوازده","سیزده","چهارده","پانزده","شانزده","هفده","هجده","نوزده"];
const DAHGAN=["","ده","بیست","سی","چهل","پنجاه","شصت","هفتاد","هشتاد","نود"];
const SADGAN=["","صد","دویست","سیصد","چهارصد","پانصد","ششصد","هفتصد","هشتصد","نهصد"];
const MAGN=["","هزار","میلیون","میلیارد"];
function threeDigitWords(n){
  const parts=[]; const s=Math.floor(n/100); const rem=n%100;
  if(s) parts.push(SADGAN[s]);
  if(rem){
    if(rem<10) parts.push(YEKAN[rem]);
    else if(rem<20) parts.push(DAHYEK[rem-10]);
    else { const d=Math.floor(rem/10), y=rem%10; parts.push(y ? DAHGAN[d]+' و '+YEKAN[y] : DAHGAN[d]); }
  }
  return parts.join(' و ');
}
function numToWordsFa(num){
  num = Math.floor(Math.abs(Number(num)||0));
  if(num===0) return 'صفر';
  const groups=[]; let n=num;
  while(n>0){ groups.push(n%1000); n=Math.floor(n/1000); }
  const parts=[];
  for(let i=groups.length-1;i>=0;i--){
    if(groups[i]===0) continue;
    let w=threeDigitWords(groups[i]);
    if(i>0) w += ' ' + MAGN[i];
    parts.push(w);
  }
  return parts.join(' و ');
}
function amountWords(n, code){ return numToWordsFa(n) + ' ' + curLabel(code); }

/* ---------------- ui state ---------------- */
let ui = {
  screen: 'auth', authMode: 'login',
  activeCurrency: 'AFN', search: '', statusFilter: 'all',
  showAddCustomer: false, editingCustomerId: null, pinModalCustomerId: null, pinInput: '', pinError: '',
  selectedCustomerId: null, custCurrency: 'AFN', txType: null, editingTxId: null,
  showStatement: false, txShowCount: 50, authError: '', importError: '', importOk: '', showBackupPanel: false, txTypeFilter: 'all', confirmDeleteTxId: null, justAddedTxId: null, showSettings: false, settingsError: '', settingsOk: '', pendingPhoto: null, pendingEditPhoto: null
};
function readAndCompressPhoto(file, callback){
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const size = 160;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const scale = Math.max(size/img.width, size/img.height);
      const w = img.width*scale, h = img.height*scale;
      ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.72));
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function b64encode(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function b64decode(str){ const bin = atob(str); const arr = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); return arr; }
async function enableBiometric(){
  ui.settingsError=''; ui.settingsOk='';
  if(!window.isSecureContext || !navigator.credentials || !window.PublicKeyCredential){
    ui.settingsError = 'قفل اثرانگشت فقط روی لینک آنلاین (HTTPS) کار می‌کند، نه فایل محلی.';
    render(); return;
  }
  try{
    const available = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
    if(!available){ ui.settingsError='این گوشی/مرورگر از قفل اثرانگشت پشتیبانی نمی‌کند.'; render(); return; }
    const challenge = new Uint8Array(32); crypto.getRandomValues(challenge);
    const userId = new Uint8Array(16); crypto.getRandomValues(userId);
    const cred = await navigator.credentials.create({ publicKey: {
      challenge, rp: { name: 'مدیریت حساب‌ها' },
      user: { id: userId, name: session, displayName: session },
      pubKeyCredParams: [{alg:-7,type:'public-key'},{alg:-257,type:'public-key'}],
      authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required' },
      timeout: 60000,
    }});
    const a = acc();
    a.biometricCredId = b64encode(cred.rawId);
    saveDB(DB);
    ui.settingsOk = 'قفل اثرانگشت فعال شد.';
    render();
    showToast('قفل اثرانگشت فعال شد');
  } catch(e){
    ui.settingsError = 'فعال‌سازی اثرانگشت لغو شد یا ناموفق بود.';
    render();
  }
}
function disableBiometric(){
  const a = acc();
  delete a.biometricCredId;
  saveDB(DB);
  ui.settingsOk = 'قفل اثرانگشت غیرفعال شد.';
  render();
  showToast('قفل اثرانگشت غیرفعال شد');
}
async function loginWithBiometric(){
  const remembered = getRememberedUsername();
  const a = DB.accounts[remembered];
  if(!a || !a.biometricCredId) return;
  try{
    const challenge = new Uint8Array(32); crypto.getRandomValues(challenge);
    await navigator.credentials.get({ publicKey: {
      challenge,
      allowCredentials: [{ id: b64decode(a.biometricCredId), type:'public-key' }],
      userVerification: 'required', timeout: 60000,
    }});
    session = remembered;
    ui.screen = 'home';
    render();
  } catch(e){
    ui.authError = 'ورود با اثرانگشت ناموفق بود. پین را وارد کنید.';
    render();
  }
}

function customerCurrencyGross(customerId, code){
  const a = acc(); let withdraw=0, deposit=0;
  a.transactions.forEach(t=>{
    if(t.customerId!==customerId || t.currency!==code) return;
    if(t.type==='withdraw') withdraw+=t.amount; else deposit+=t.amount;
  });
  return { withdraw, deposit };
}
function customerBalances(customerId){
  const a = acc(); const out = {}; CURRENCIES.forEach(c=> out[c.code]=0);
  a.transactions.filter(t=>t.customerId===customerId).forEach(t=>{
    const sign = t.type==='withdraw' ? 1 : -1;
    out[t.currency] = (out[t.currency]||0) + sign*t.amount;
  });
  return out;
}
function currencyStats(code){
  const a = acc(); const s = { withdraw:0, deposit:0, debt:0, credit:0 };
  a.transactions.forEach(t=>{
    if(t.currency!==code) return;
    if(t.type==='withdraw') s.withdraw += t.amount; else s.deposit += t.amount;
  });
  s.debt = s.withdraw;
  s.credit = s.deposit;
  return s;
}

/* ---------------- statement ---------------- */
function downloadStatement(){
  const a = acc();
  const cust = a.customers.find(c=>c.id===ui.selectedCustomerId);
  const list = a.transactions.filter(t=>t.customerId===cust.id && t.currency===ui.custCurrency)
    .sort((x,y)=> (y.datetime||'').localeCompare(x.datetime||'') || (y.createdAt||'').localeCompare(x.createdAt||''));
  const width = 820;
  const contentW = width - 48;
  const measureCanvas = document.createElement('canvas');
  const mctx = measureCanvas.getContext('2d');

  function wrapText(text, font, maxWidth){
    mctx.font = font;
    const words = String(text).split(' ');
    const lines = [];
    let cur = '';
    for(const w of words){
      const test = cur ? cur+' '+w : w;
      if(mctx.measureText(test).width > maxWidth && cur){
        lines.push(cur);
        cur = w;
      } else {
        cur = test;
      }
    }
    if(cur) lines.push(cur);
    return lines;
  }

  const rowPad = 16;
  const rows = list.map(t=>{
    const noteLines = t.note ? wrapText('توضیح: '+t.note, '12.5px Tahoma, sans-serif', contentW) : [];
    const lineCount = 1 + noteLines.length; // date line + note lines
    const h = 20 + (lineCount * 18) + rowPad;
    return { t, noteLines, h };
  });

  const headerLines = [`مشتری: ${cust.name}`, `ارز: ${curLabel(ui.custCurrency)}`];
  if(cust.phone) headerLines.push(`تماس: ${cust.phone}`);
  if(cust.address) headerLines.push(`محل: ${cust.address}`);
  const headerH = 50 + headerLines.length*22 + 20;
  const totalRowsH = rows.reduce((s,r)=>s+r.h, 0);
  const height = headerH + Math.max(totalRowsH, 40) + 30;

  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.direction = 'rtl';
  ctx.fillStyle = '#050a14'; ctx.fillRect(0,0,width,height);
  ctx.fillStyle = '#e8edf5'; ctx.textAlign='right'; ctx.font='bold 24px Tahoma, sans-serif';
  ctx.fillText('صورت‌حساب مشتری', width-24, 40);
  ctx.font='14px Tahoma, sans-serif'; ctx.fillStyle='#9aabc4';
  let hy = 68;
  headerLines.forEach(line=>{ ctx.fillText(line, width-24, hy); hy += 22; });
  ctx.strokeStyle='#233246'; ctx.beginPath(); ctx.moveTo(24, headerH-14); ctx.lineTo(width-24, headerH-14); ctx.stroke();

  let curY = headerH;
  rows.forEach((r,i)=>{
    ctx.fillStyle = i%2===0 ? '#0a1120' : '#050a14';
    ctx.fillRect(24, curY - 10, contentW, r.h);
    ctx.fillStyle = r.t.type==='withdraw' ? '#e2685a' : '#5fbf7a';
    ctx.font='bold 15px Tahoma, sans-serif';
    ctx.fillText((r.t.type==='withdraw'?'برداشت':'واریز')+'  '+fmtMoney(r.t.amount, r.t.currency), width-24, curY+10);
    ctx.fillStyle='#9aabc4'; ctx.font='12.5px Tahoma, sans-serif';
    ctx.textAlign = 'right'; ctx.direction = 'ltr';
    ctx.fillText(fmtDateTime(r.t.datetime), width-24, curY+30);
    ctx.direction = 'rtl';
    r.noteLines.forEach((line, li)=>{ ctx.fillText(line, width-24, curY+30+(li+1)*18); });
    curY += r.h;
  });
  if(rows.length===0){ ctx.fillStyle='#7f93b3'; ctx.font='14px Tahoma, sans-serif'; ctx.fillText('تراکنشی ثبت نشده است.', width-24, headerH+20); }

  canvas.toBlob(blob=>{
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url; link.download = `statement-${cust.name}.png`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  });
}

        <p style="font-size:13.5px;color:var(--dim);">آیا مطمئن هستید که می‌خواهید این تراکنش را حذف کنید؟</p>
        <div class="card" style="margin-bottom:14px;">
          <div class="tx-amount ${t.type}" style="font-weight:800;">${t.type==='withdraw'?'برداشت':'واریز'} — ${fmtMoney(t.amount,t.currency)}</div>
          <div class="tx-meta">${fmtDateTime(t.datetime)}${t.note ? '  '+escapeHtml(t.note) : ''}</div>
        </div>
        <div class="form-actions">
          <button class="btn btn-red" onclick="deleteTx('${t.id}')">بله، حذف شود</button>
          <button class="btn btn-neutral" onclick="cancelDeleteTx()">انصراف</button>
        </div>
      </div>
    </div>`;
}

function renderEditTxModal(){
  const a = acc();
  const t = a.transactions.find(x=>x.id===ui.editingTxId);
  const d = new Date(t.datetime);
  const jp = getJalaliParts(d);
  const p2 = x=>String(x).padStart(2,'0');
  return `
    <div class="modal-backdrop" onclick="ui.editingTxId=null; render();">
      <div class="modal-box" onclick="event.stopPropagation();">
        <h3 style="margin-top:0;">ویرایش تراکنش</h3>
        <form onsubmit="submitEditTx(event)">
          <div class="form-grid">
            <div>
              <label class="label">مبلغ</label>
              <input class="input" type="number" min="0" id="et-amount" value="${t.amount}" oninput="document.getElementById('et-words').textContent = amountWords(this.value, '${t.currency}');">
              <div class="words-hint" id="et-words">${amountWords(t.amount, t.currency)}</div>
            </div>
            <div>
              <label class="label">تاریخ (شمسی) و ساعت</label>
              <div style="display:flex;gap:5px;align-items:center;" dir="ltr">
                <input class="input" type="number" id="et-jy" value="${jp.jy}" style="flex:1.6;min-width:64px;text-align:center;" placeholder="سال">
                <span style="color:var(--dim);">/</span>
                <input class="input" type="number" id="et-jm" value="${jp.jm}" min="1" max="12" style="flex:1;min-width:40px;text-align:center;" placeholder="ماه">
                <span style="color:var(--dim);">/</span>
                <input class="input" type="number" id="et-jd" value="${jp.jd}" min="1" max="31" style="flex:1;min-width:40px;text-align:center;" placeholder="روز">
                <input class="input" type="number" id="et-hh" value="${p2(d.getHours())}" min="0" max="23" style="flex:1;min-width:40px;text-align:center;margin-inline-start:6px;" placeholder="ساعت">
                <span style="color:var(--dim);">:</span>
                <input class="input" type="number" id="et-mm" value="${p2(d.getMinutes())}" min="0" max="59" style="flex:1;min-width:40px;text-align:center;" placeholder="دقیقه">
              </div>
            </div>
            <div><label class="label">توضیحات</label><input class="input" id="et-note" value="${escapeHtml(t.note||'')}"></div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-green">ذخیره تغییرات</button>
            <button type="button" class="btn btn-ghost" onclick="ui.editingTxId=null; render();">انصراف</button>
          </div>
        </form>
      </div>
    </div>`;
}
function renderStatementModal(cust, txList){
  return `
    <div class="modal-backdrop" onclick="ui.showStatement=false; render();">
      <div class="modal-box" onclick="event.stopPropagation();" style="max-width:520px;">
        <h3 style="margin-top:0;">صورت‌حساب — ${escapeHtml(cust.name)}</h3>
        <div style="max-height:320px;overflow-y:auto;margin-bottom:14px;">
          ${txList.length===0 ? '<div class="empty">تراکنشی ثبت نشده است.</div>' : txList.map(t=>`
            <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;">
              <span style="color:${t.type==='withdraw'?'var(--red)':'var(--green)'}">${t.type==='withdraw'?'برداشت':'واریز'} ${fmtMoney(t.amount,t.currency)}</span>
              <span style="color:var(--dim);">${fmtDateTime(t.datetime)}</span>
            </div>
          `).join('')}
        </div>
        <div class="form-actions">
          <button class="btn btn-blue" onclick="downloadStatement()">دانلود صورت‌حساب (تصویر)</button>
          <button class="btn btn-ghost" onclick="ui.showStatement=false; render();">بستن</button>
        </div>
      </div>
    </div>`;
}

window.addEventListener('popstate', () => {
  if (ui.screen === 'customer') {
    ui.screen = 'home';
    ui.selectedCustomerId = null;
    render();
  }
});
render();
</script>
</body>
</html>
